name: Reliability regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock_court_system
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mock_court_system/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend-reliability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock_court_system
    env:
      LLM_API_KEY: ''
      LLM_BASE_URL: ''
      LLM_MODEL: ''
      DASHSCOPE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mock_court_system/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: HTTP attribution, case hydration and role isolation
        run: >-
          python -m pytest -q
          tests/test_eval_attribution.py
          tests/test_evaluation_http.py
          tests/test_pack_hydration.py
          tests/test_civil_identity.py
          tests/test_session_links.py
          tests/test_conversation_stream.py
          tests/test_game_score_degraded.py
          tests/test_session_persist.py
          tests/test_research_runtime.py
          tests/test_visibility_allowlists.py
          tests/test_research_eval_export.py

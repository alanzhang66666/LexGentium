# Declared alert rules (release-readiness design §observability).
# evaluation_interval_s is the tick cadence; window_s is the trailing sample
# window; for_duration_s is how long the condition must hold before firing.
rules:
  - name: stable_route_error_rate
    type: error_ratio
    window_s: 300
    min_requests: 20
    error_ratio: 0.05
    for_duration_s: 0
    evaluation_interval_s: 60
    operator_link: docs/RUNBOOK.md#stable-route-error-rate

  - name: readiness_failure
    type: readiness
    window_s: 120
    for_duration_s: 120
    evaluation_interval_s: 60
    operator_link: docs/RUNBOOK.md#readiness-failure

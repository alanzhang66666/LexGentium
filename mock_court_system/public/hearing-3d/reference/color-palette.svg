<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="#f7f6f2"/><g font-family="sans-serif" fill="#243448"><text x="45" y="48" font-size="26">05 / 溯源五态 · 颜色与形状双重编码</text><rect x="55" y="95" width="80" height="75" rx="3" fill="#207963" stroke="#526174"/><text x="165" y="123" font-size="23">证据支持 / supported</text><text x="165" y="155" font-size="20">✓  可表演有证据支持的事实</text><rect x="55" y="210" width="80" height="75" rx="3" fill="#ffffff" stroke="#526174"/><text x="165" y="238" font-size="23">未知 / unknown</text><text x="165" y="270" font-size="20">?  镂空问号；不发言、不补全</text><rect x="55" y="325" width="80" height="75" rx="3" fill="#a6573f" stroke="#526174"/><text x="165" y="353" font-size="23">未支持 / unsupported</text><text x="165" y="385" font-size="20">!  不作为结论依据</text><rect x="55" y="440" width="80" height="75" rx="3" fill="#74808d" stroke="#526174"/><text x="165" y="468" font-size="23">已排除 / excluded</text><text x="165" y="500" font-size="20">×  灰色删除线；保留原因</text><rect x="55" y="555" width="80" height="75" rx="3" fill="#70558f" stroke="#526174"/><text x="165" y="583" font-size="23">人工冻结 / frozen</text><text x="165" y="615" font-size="20">锁  保留历史外观，不自动更新</text><text x="55" y="718" font-size="19">未知 ≠ 未支持 ≠ 已排除；状态转换由事实与人工规则决定。</text></g></svg>